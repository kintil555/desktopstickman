[package]
name = "desktopstickman"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
winit = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"

[target.'cfg(not(windows))'.dependencies]
softbuffer = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
